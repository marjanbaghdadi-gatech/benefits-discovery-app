<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Benefits Navigator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Georgia Benefits Navigator</h1>
            <br>
            <p><strong>Find benefits and supports available to you.</strong></p>
            <br>
            <p>Information provided in the form will be used only to match you with programs you may qualify for.</p>
        </header>

        <div class="form-card">

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" min="1" placeholder="Enter your age">
            </div>

            <div class="form-group">
                <label for="income">Income</label>
<select id="income">
                    <option value="">Select income range</option>
                    <option value="0|1000">Under $1,000 / month</option>
                    <option value="1000|2000">$1,000 – $2,000 / month</option>
                    <option value="2000|3500">$2,000 – $3,500 / month</option>
                    <option value="3500|5000">$3,500 – $5,000 / month</option>
                    <option value="5000|null">Over $5,000 / month</option>
                </select>
            </div>

            <div class="form-group">
                <label for="disability">Disability</label>
                <select id="disability">
                    <option value="">Select an option</option>
                    <option value="none">No disability</option>
                    <option value="prefer_not_to_say">Prefer not to say</option>
                    <optgroup label="Physical">
                        <option value="mobility">Mobility impairment</option>
                    </optgroup>
                    <optgroup label="Sensory">
                        <option value="vision">Vision / Blindness</option>
                        <option value="hearing">Hearing / Deafness</option>
                    </optgroup>
                    <optgroup label="Cognitive">
                        <option value="cognitive">Cognitive impairment</option>
                        <option value="dementia">Dementia / Memory loss</option>
                    </optgroup>
                    <optgroup label="Developmental">
                        <option value="developmental">Developmental disability</option>
                    </optgroup>
                    <option value="multiple">Multiple disabilities</option>
                </select>
            </div>

            <div class="form-group">
                <label for="veteran">Veteran Status</label>
                <select id="veteran">
                    <option value="">Select an option</option>
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>
            </div>

            <button id="searchBtn">Find Benefits</button>

        </div>

        <div id="results"></div>

    </div>

    <script src="app.js"></script>

</body>
</html>
