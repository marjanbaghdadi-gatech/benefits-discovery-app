<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Benefits Navigator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Georgia Benefits Navigator</h1>
            <p>Find benefits and supports available to you.</p>
            <p class="field-note">The information asked below is used only to match you with programs you may qualify for.</p>
        </header>

        <div class="form-card">

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" inputmode="numeric" min="0" max="120" placeholder="Enter your age">
            </div>

            <div class="form-group">
                <label for="zip">Zip Code</label>
                <input type="text" id="zip" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="Enter your 5-digit zip code">
            </div>

            <div class="form-group">
                <label for="income">Annual Household Gross Income (Before Taxes)</label>
                <input type="number" id="income" inputmode="numeric" min="0" placeholder="Enter your annual household gross income">
            </div>

            <div class="form-group">
                <label for="householdSize">Household Size</label>
                <input type="number" id="householdSize" inputmode="numeric" min="1" placeholder="Enter number of people in your household">
            </div>

            <div class="form-group">
                <label for="disabilityStatus">Disability Status</label>
                <select id="disabilityStatus">
                    <option value="">Select an option</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                    <option value="unsure">Unsure</option>
                    <option value="prefer_not_to_answer">Prefer not to answer</option>
                </select>
            </div>

            <div class="form-group" id="disabilityTypeGroup" hidden>
                <label for="disabilityTypeToggle">Disability Type</label>
                <div class="multiselect" id="disabilityType">
                    <button type="button" class="multiselect-toggle" id="disabilityTypeToggle">
                        Select disability type(s)
                    </button>
                    <div class="multiselect-panel" id="disabilityTypePanel" hidden>
                        <label class="checkbox-option"><input type="checkbox" value="physical"> Physical disability</label>
                        <label class="checkbox-option"><input type="checkbox" value="mobility"> Mobility impairment</label>
                        <label class="checkbox-option"><input type="checkbox" value="vision"> Blind / Low Vision</label>
                        <label class="checkbox-option"><input type="checkbox" value="hearing"> Deaf / Hard of Hearing</label>
                        <label class="checkbox-option"><input type="checkbox" value="intellectual"> Intellectual Disability</label>
                        <label class="checkbox-option"><input type="checkbox" value="developmental"> Developmental Disability</label>
                        <label class="checkbox-option"><input type="checkbox" value="autism"> Autism</label>
                        <label class="checkbox-option"><input type="checkbox" value="mental_health"> Mental Health Condition</label>
                        <label class="checkbox-option"><input type="checkbox" value="cognitive"> Cognitive Impairment / Dementia</label>
                        <label class="checkbox-option"><input type="checkbox" value="chronic_illness"> Chronic Illness</label>
                        <label class="checkbox-option"><input type="checkbox" value="tbi"> Traumatic Brain Injury</label>
                        <label class="checkbox-option"><input type="checkbox" value="multiple"> Multiple Disabilities</label>
                        <label class="checkbox-option"><input type="checkbox" value="other"> Other</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="veteran">Veteran Status</label>
                <select id="veteran">
                    <option value="">Select an option</option>
                    <option value="veteran">Veteran</option>
                    <option value="active_duty_national_guard_reserve">Active Duty / National Guard / Reserve</option>
                    <option value="military_spouse_widow_dependent">Military Spouse / Widow(er) / Dependent</option>
                    <option value="prefer_not_to_answer">Prefer not to answer</option>
                    <option value="none">None</option>
                </select>

            </div>

            <div class="form-group">
                <label for="needsToggle">What Do You Need Help With the Most?</label>
                <div class="multiselect" id="needs">
                    <button type="button" class="multiselect-toggle" id="needsToggle">
                        Select need(s)
                    </button>
                    <div class="multiselect-panel" id="needsPanel" hidden>
                        <label class="checkbox-option"><input type="checkbox" value="health_medical_care"> Health &amp; Medical Care</label>
                        <label class="checkbox-option"><input type="checkbox" value="financial_assistance"> Financial Assistance</label>
                        <label class="checkbox-option"><input type="checkbox" value="food_nutrition"> Food &amp; Nutrition</label>
                        <label class="checkbox-option"><input type="checkbox" value="housing_home_support"> Housing &amp; Home Support</label>
                        <label class="checkbox-option"><input type="checkbox" value="transportation"> Transportation</label>
                        <label class="checkbox-option"><input type="checkbox" value="disability_independent_living"> Disability &amp; Independent Living</label>
                        <label class="checkbox-option"><input type="checkbox" value="aging_services_caregiving"> Aging Services &amp; Caregiving</label>
                        <label class="checkbox-option"><input type="checkbox" value="employment_education"> Employment &amp; Education</label>
                        <label class="checkbox-option"><input type="checkbox" value="legal_advocacy"> Legal &amp; Advocacy</label>
                        <label class="checkbox-option"><input type="checkbox" value="mental_health_wellbeing"> Mental Health &amp; Well-being</label>
                        <label class="checkbox-option"><input type="checkbox" value="veteran_military_support"> Veteran &amp; Military Support</label>
                        <label class="checkbox-option"><input type="checkbox" value="benefits_navigation_case_management"> Benefits Navigation &amp; Case Management</label>
                    </div>
                </div>
            </div>

            <button id="searchBtn">Find Benefits</button>

        </div>

        <div id="results"></div>

    </div>

    <script src="app.js"></script>

</body>
</html>
