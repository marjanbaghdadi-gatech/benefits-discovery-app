<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benefits Navigator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Benefits Navigator</h1>
            <p>Find benefits and supports available to you.</p>
            <p class="field-note">Used only to match you with programs you may qualify for.</p>
        </header>

        <div class="form-card">

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" min="1" placeholder="Enter your age">
            </div>

            <div class="form-group">
                <label for="income">Income</label>
                <select id="income">
                    <option value="">Select income range</option>
                    <option value="0|1000">Under $1,000 / month</option>
                    <option value="1000|2000">$1,000 – $2,000 / month</option>
                    <option value="2000|3500">$2,000 – $3,500 / month</option>
                    <option value="3500|5000">$3,500 – $5,000 / month</option>
                    <option value="5000|null">Over $5,000 / month</option>
                </select>
            </div>

            <div class="form-group">
                <label for="disability">Disability</label>
                <select id="disability">
                    <option value="">Select an option</option>
                    <option value="none">No disability</option>
                    <option value="prefer_not_to_say">Prefer not to say</option>
                    <optgroup label="Physical &amp; Mobility">
                        <option value="mobility">Mobility / Movement difficulty</option>
                        <option value="chronic_pain">Chronic pain</option>
                        <option value="fatigue">Fatigue / Low stamina</option>
                    </optgroup>
                    <optgroup label="Sensory">
                        <option value="vision">Vision / Low vision / Blindness</option>
                        <option value="hearing">Hearing / Deafness</option>
                        <option value="speech">Speech / Communication</option>
                    </optgroup>
                    <optgroup label="Cognitive &amp; Mental Health">
                        <option value="cognitive">Memory / Cognitive impairment</option>
                        <option value="mental_health">Mental health condition</option>
                        <option value="learning">Learning disability</option>
                    </optgroup>
                    <optgroup label="Developmental">
                        <option value="autism">Autism spectrum</option>
                        <option value="intellectual">Intellectual disability</option>
                        <option value="developmental">Other developmental disability</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label for="veteran">Veteran Status</label>
                <select id="veteran">
                    <option value="">Select an option</option>
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>

            </div>

            <button id="searchBtn">Find Benefits</button>

        </div>

        <div id="results"></div>

    </div>

    <script src="app.js"></script>

</body>
</html>
